$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Footer (Tailpine)
status: stable
description: "A responsive footer with three rows (top, main, bottom). Full control over columns, alignment, width, gap, background and spacing."
group: Footer

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.

    background_color:
      type: string
      title: Set hero Background
      enum:
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - dark
        - transparent
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        dark: Dark Color
        transparent: Transparent
      examples: ['primary']

    padding_block:
      type: string
      title: "Padding Block( Top/Bottom )"
      description: "Top padding size"
      enum: [none, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, huge]
      meta:enum:
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2XL"
        3xl: "3XL"
        4xl: "4XL"
        5xl: "5XL"
        huge: "Huge Padding"
      default: lg
      examples: ["lg"]


    column_gap:
      type: string
      title: "Column Gap"
      description: "Gap between columns in all rows"
      enum: [none, xs, sm, md, lg, xl, 2xl, 3xl]
      meta:enum:
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2XL"
        3xl: "3XL"
      default: md
      examples: ["md"]

    row_gap:
      type: string
      title: "Row Gap"
      description: "Vertical gap between the top/main/bottom rows"
      enum: [none, xs, sm, md, lg, xl, 2xl, 3xl]
      default: lg
      examples: ["lg"]

    # ══════════════════════════════
    # TOP ROW
    # ══════════════════════════════
    top_columns:
      type: integer
      title: "Top Row — Number of Columns"
      description: "How many columns to show in the top row (1–3). Hides extra slots."
      enum: [0, 1, 2, 3,4]
      default: 3
      examples: [3]

    top_alignment:
      type: string
      title: "Top Row — Horizontal Alignment"
      description: "Horizontal alignment of content inside top row cells"
      enum: [left, center, right, between, around]
      default: left
      examples: ["left"]

    top_width:
      type: string
      title: "Top Row — Content Width"
      description: "Max width constraint for the top row"
      enum: [full, fit, "25", "33", "50", "66", "75", "80", "90"]
      meta:enum:
        full: "100% (Full Width)"
        fit: "Fit Content"
        "25": "25% (Quarter Width)"
        "33": "33% (One Third Width)"
        "50": "50% (Half Width)"
        "66": "66% (Two Thirds Width)"
        "75": "75% (Three Quarters Width)"
        "80": "80% Width"
        "90": "90% Width" 
      examples: ["full"]

    # ══════════════════════════════
    # MAIN ROW
    # ══════════════════════════════
    main_columns:
      type: integer
      title: "Main Row — Number of Columns (desktop)"
      description: "How many columns to show in the main row (1–6). Hides extra slots."
      enum: [0, 1, 2, 3, 4, 5, 6]
      default: 4
      examples: [4]
    main_columns_tab:
      type: integer
      title: "Main Row — No of Columns on (tablet)"
      description: "How many columns to show in the main row (1–4). Hides extra slots."
      enum: [0, 1, 2, 3, 4]
      default: 4
      examples: [4]

    main_alignment:
      type: string
      title: "Main Row — Horizontal Alignment"
      enum: [left, center, right, between, around]
      default: left
      examples: ["left"]

    main_width:
      type: string
      title: "Main Row — Content Width"
      enum: [full, fit, "25", "33", "50", "66", "75", "80", "90"]
      meta:enum:
        full: "100% (Full Width)"
        fit: "Fit Content"
        "25": "25% (Quarter Width)"
        "33": "33% (One Third Width)"
        "50": "50% (Half Width)"
        "66": "66% (Two Thirds Width)"
        "75": "75% (Three Quarters Width)"
        "80": "80% Width"
        "90": "90% Width"
      examples: ["full"]


    # ══════════════════════════════
    # BOTTOM ROW
    # ══════════════════════════════
    bottom_columns:
      type: integer
      title: "Bottom Row — Number of Columns"
      description: "How many columns to show in the bottom row (1–3). Hides extra slots."
      enum: [0, 1, 2, 3]
      default: 3
      examples: [3]

    bottom_alignment:
      type: string
      title: "Bottom Row — Horizontal Alignment"
      enum: [left, center, right, between, around]
      default: left
      examples: ["left"]

    bottom_width:
      type: string
      title: "Bottom Row — Content Width"
      enum: [full, fit, "25", "33", "50", "66", "75", "80", "90"]
      meta:enum:
        full: "100% (Full Width)"
        fit: "Fit Content"
        "25": "25% (Quarter Width)"
        "33": "33% (One Third Width)"
        "50": "50% (Half Width)"
        "66": "66% (Two Thirds Width)"
        "75": "75% (Three Quarters Width)"
        "80": "80% Width"
        "90": "90% Width"
      examples: ["full"]

slots:
  top_first:
    type: block
    title: "Top — Column 1"
  top_middle:
    type: block
    title: "Top — Column 2"
  top_secondlast:
    type: block
    title: "Top — Column 3"
  top_last:
    type: block
    title: "Top — Column 4"
  main_first:
    type: block
    title: "Main — Column 1"
  main_second:
    type: block
    title: "Main — Column 2"
  main_third:
    type: block
    title: "Main — Column 3"
  main_fourth:
    type: block
    title: "Main — Column 4"
  main_fifth:
    type: block
    title: "Main — Column 5"
  main_sixth:
    type: block
    title: "Main — Column 6"
  bottom_first:
    type: block
    title: "Bottom — Column 1"
  bottom_middle:
    type: block
    title: "Bottom — Column 2"
  bottom_last:
    type: block
    title: "Bottom — Column 3"
