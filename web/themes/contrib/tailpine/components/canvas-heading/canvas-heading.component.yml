$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json

name: Heading (Tailpine)
group: Base
status: stable
description: Flexible responsive heading component built with Tailwind.

props:
  type: object
  required:
    - heading_text
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.

    heading_text:
      type: string
      title: Heading text
      default: "Your heading"
      examples:
        - Build smarter with Tailpine
    highlight_text:
      type: string
      title: Highlight text
      examples:
        - Tailpine
    level:
      type: number
      title: HTML heading level (h2)
      enum: [1, 2, 3, 4, 5, 6]
      "meta:enum":
        1: H1
        2: H2
        3: H3
        4: H4
        5: H5
        6: H6
      examples:
        - 2

    text_size:
      type: string
      title: Size
      enum:
        - default
        - text-8xl(96px)
        - text-7xl(72px)
        - text-6xl(60px)
        - text-5xl(48px)
        - text-4xl(36px)
        - text-3xl(30px)
        - text-2xl(24px)
        - text-xl(20px)
        - text-lg(18px)
        - text-base(16px)
        - text-sm(14px)
        - text-xsm(12px)
      default: text-xl(20px)
      examples:
        - "text-5xl(48px)"

    font_weight:
      title: "Font Weight"
      description: "Choose the font weight for the text."
      type: string
      enum:
        - font-thin
        - font-extralight
        - font-light
        - font-normal
        - font-medium
        - font-semibold
        - font-bold
        - font-extrabold
        - font-black
      "meta:enum":
        font-thin: "Thin (100)"
        font-extralight: "Extra Light (200)"
        font-light: "Light (300)"
        font-normal: "Normal (400)"
        font-medium: "Medium (500)"
        font-semibold: "Semi Bold (600)"
        font-bold: "Bold (700)"
        font-extrabold: "Extra Bold (800)"
        font-black: "Black (900)"
      default: "font-normal"
      examples:
        - "font-normal"

    heading_text_width:
      type: string
      title: heading text width
      enum:
        - "10%"
        - "20%"
        - "25%"
        - "30%"
        - "33%"
        - "40%"
        - "50%"
        - "60%"
        - "66%"
        - "70%"
        - "75%"
        - "80%"
        - "90%"
        - "full"
        - "fit"

      meta:enum:
        10%: '10%'
        20%: '20%'
        25%: '25%'
        30%: '30%'
        33%: '33%'
        40%: '40%'
        50%: '50%'
        60%: '60%'
        66%: '66%'
        70%: '70%'
        75%: '75%'
        80%: '80%'
        90%: '90%'
        full: '100% (Full Width)'
        fit: "Fit Content"
      examples: ['fit'] 

    text_color:
      type: string
      title: Text color
      enum:
        - none
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - dark
        - transparent
      meta:enum:
        none: None
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        dark: Dark Color
        transparent: Transparent
      examples: ['none']

    highlight_color:
      type: string
      title: Highlight color
      enum:
        - none
        - primary
        - secondary
        - tertiary
        - body
        - heading
        - dark
        - surface-100
        - surface-200
        - surface-300
      meta:enum:
        none: None
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        heading: Heading
        dark: Dark
        surface-100: Surface 100
        surface-200: Surface 200
        surface-300: Surface 300
      default: primary
      examples: ['body']

    text_bg_color:
      type: string
      title: Heading Background
      enum:
        - none
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - dark
      meta:enum:
        none: None
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        dark: Dark Color


    text_align:
      type: string
      title: Horizontal Alignment
      enum: ['left', 'center', 'right']
      default: 'left'
      examples: ['left']

    url:
      type: string
      title: Optional link

    underline:
      type: boolean
      title: Enable Underline
      examples:
        - false
      default:
        - false

    underline_color:
      type: string
      title: Set underline color
      enum:
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - border
        - dark
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        border: Border Color
        dark: Dark Color
      examples: ['border']

    text_underline_width:
      type: string
      title: Add underline
      enum:
        - "10%"
        - "20%"
        - "25%"
        - "30%"
        - "33%"
        - "40%"
        - "50%"
        - "60%"
        - "66%"
        - "70%"
        - "75%"
        - "80%"
        - "90%"
        - "full"
        - "fit"
      meta:enum:
        20%: '20%'
        25%: '25%'
        30%: '30%'
        33%: '33%'
        40%: '40%'
        50%: '50%'
        60%: '60%'
        66%: '66%'
        70%: '70%'
        75%: '75%'
        80%: '80%'
        90%: '90%'
        full: '100% (Full Width)'
        fit: "Fit Content"
      examples: ['33%'] 

    underline_alignment:
      type: string
      title: Underline alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: LEFT
        center: CENTERED
        right: RIGHT

    underline_offset:
      type: string
      title: Set Underline Offset
      enum:
        - xsm
        - sm
        - base
        - medium
        - large
        - xlarge
        - wide
        - huge
      meta:enum:
        xsm: EXTRA SMAL
        sm: SMALL
        base: BASE
        medium: MEDIUM
        large: LARGE
        xlarge: EXTRA LARGE
        wide: WIDE
        huge: HUGE
      examples: ['base']

    padding_inline:
      type: string
      title: Padding inline (Left / Right)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Padding"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    padding_block:
      type: string
      title: Padding Block (Top / Bottom)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Padding"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    margin_top:
      type: string
      title: Margin ( Top )
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Margin Top"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    margin_bottom:
      type: string
      title: Margin (Bottom)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Margin Bottom"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]



    heading_classes:
      type: array
      items:
        type: string
      title: Extra CSS classes
