$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json

name: User name (Canvas)
description: 'A simple user name field to display user name with link.'
status: stable
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    user_name:
      type: string
      title: user name
      description: 'The name of the user to display.'
      examples: ['John Doe', 'JaneSmith']
      default: 'Anonymous'
    link_path:
      type: string
      title: URL
      description: 'The URL to link the user name to.'
      examples: ['/user/1', 'https://example.com/profile']
      default: ''
    link_target:
      type: string
      title: Link Target
      description: 'The target attribute for the link.'
      examples: ['_self', '_blank']
      default: '_self'
    name:
      type: string
      title: Name
      description: The user's sanitized display name.
    extra:
      type: string
      title: Extra
      description: Additional text appended to the user's name.
