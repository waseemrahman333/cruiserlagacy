$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Card Style Two (Canvas)
status: stable 
description: "Card style two are used to group and display content in a way that is easily readable."
group: Cards & Posts
slots:
  cta:
    title: Cta
    description: "Link of the Card. Plain text."
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    imageurl:
      type: object
      title:  imageurl
      $ref: json-schema-definitions://canvas.module/image
      description: "The image overlay URL."
      examples:
        - src: 'card.jpg'
          alt: 'card Image'
          width: 450
          height: 400      
    title:
      title: Name
      type: string
      description: "Name of the card. Plain text."
      examples: ['Example Name']
    description:
      title: Description
      type: string
      description: "Description of the card. Plain text."
      contentMediaType: text/html
      x-formatting-context: block
      examples: ['<p>This is <strong>formatted</strong> description</p>']
