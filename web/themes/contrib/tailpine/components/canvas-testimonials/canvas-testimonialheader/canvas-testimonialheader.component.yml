$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Testimonial   Header (Canvas)
status: stable
description: "Testimonial Wrapper are used to group and display content in a way that is easily readable."
group: Teams & Testimonials
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    bg_color:
      type: string
      title: Background Color
      description: "Background color of the Wrapper. Plain text."
      default: ''
      enum:
        - primary
        - secondary
        - tertiary
        - gradient
      examples: ['primary', 'secondary']
    title:
      title: Title
      type: string
      description: "Title of the Wrapper. Plain text."
      examples: ['Testimonial Header Title']
slots:
  content:
    title: Content
    description: "Content of the Wrapper. Plain text."
