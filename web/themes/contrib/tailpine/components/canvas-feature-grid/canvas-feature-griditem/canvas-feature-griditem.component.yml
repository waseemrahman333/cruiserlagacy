$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Feature Grid Item (Canvas)
group: Tailpine
status: stable
description: A single feature card inside a canvas-feature-grid.

props:
  type: object
  properties:

    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.

    icon:
      type: string
      title: Icon
      description: Icon character, emoji, or short text.
      examples:
        - '⚡'

    title:
      type: string
      title: Title
      examples:
        - 'Lightning fast'

    body:
      type: string
      title: Body
      description: Supporting description. Supports HTML.
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Optimised for performance from the ground up.</p>'

    show_icon:
      type: boolean
      title: Show icon
      default: true
      examples:
        - true

slots:
  cta:
    title: Call to action
    description: Optional button or link for this feature.
