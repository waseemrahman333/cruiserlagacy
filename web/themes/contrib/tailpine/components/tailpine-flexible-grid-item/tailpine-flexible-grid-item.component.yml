$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Flexible Grid Item (Canvas)
status: stable
group: Tailpine
description: "A single cell inside a Flexible Grid. Choose how wide it should be on each screen size — for example, 'Half' on desktop and 'Full width' on mobile — then drop any component inside."

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.

    width_mobile:
      type: string
      title: "Width on mobile"
      description: "How many columns this cell spans on mobile screens (assumes a 12-column parent)."
      default: full
      enum:
        - full
        - half
        - one_third
        - two_thirds
        - one_quarter
        - three_quarters
        - one_sixth
        - five_sixths
      "meta:enum":
        full: "Full width"
        half: "Half (1/2)"
        one_third: "One-third (1/3)"
        two_thirds: "Two-thirds (2/3)"
        one_quarter: "One-quarter (1/4)"
        three_quarters: "Three-quarters (3/4)"
        one_sixth: "One-sixth (1/6)"
        five_sixths: "Five-sixths (5/6)"
      examples:
        - full

    width_tablet:
      type: string
      title: "Width on tablet"
      description: "Column span at the md: breakpoint (≥ 768px). Assumes a 12-column parent."
      default: half
      enum:
        - full
        - half
        - one_third
        - two_thirds
        - one_quarter
        - three_quarters
        - one_sixth
        - five_sixths
      "meta:enum":
        full: "Full width"
        half: "Half (1/2)"
        one_third: "One-third (1/3)"
        two_thirds: "Two-thirds (2/3)"
        one_quarter: "One-quarter (1/4)"
        three_quarters: "Three-quarters (3/4)"
        one_sixth: "One-sixth (1/6)"
        five_sixths: "Five-sixths (5/6)"
      examples:
        - half

    width_desktop:
      type: string
      title: "Width on desktop"
      description: "Column span at the lg: breakpoint (≥ 1024px). Assumes a 12-column parent."
      default: one_third
      enum:
        - full
        - half
        - one_third
        - two_thirds
        - one_quarter
        - three_quarters
        - one_sixth
        - five_sixths
      "meta:enum":
        full: "Full width"
        half: "Half (1/2)"
        one_third: "One-third (1/3)"
        two_thirds: "Two-thirds (2/3)"
        one_quarter: "One-quarter (1/4)"
        three_quarters: "Three-quarters (3/4)"
        one_sixth: "One-sixth (1/6)"
        five_sixths: "Five-sixths (5/6)"
      examples:
        - one_third

    width_wide:
      type: string
      title: "Width on wide screens"
      description: "Column span at the xl: breakpoint (≥ 1280px). Assumes a 12-column parent."
      default: one_third
      enum:
        - full
        - half
        - one_third
        - two_thirds
        - one_quarter
        - three_quarters
        - one_sixth
        - five_sixths
      "meta:enum":
        full: "Full width"
        half: "Half (1/2)"
        one_third: "One-third (1/3)"
        two_thirds: "Two-thirds (2/3)"
        one_quarter: "One-quarter (1/4)"
        three_quarters: "Three-quarters (3/4)"
        one_sixth: "One-sixth (1/6)"
        five_sixths: "Five-sixths (5/6)"
      examples:
        - one_third

    extra_height:
      type: string
      title: "Cell height"
      description: "Make this cell taller so it spans two rows of the grid."
      default: normal
      enum:
        - normal
        - double
      "meta:enum":
        normal: "Normal (single row)"
        double: "Double (span two rows)"
      examples:
        - normal

    align_self:
      type: string
      title: "Vertical position"
      description: "Override vertical alignment for this cell only (overrides the parent grid's Align items setting)."
      default: default
      enum:
        - default
        - top
        - center
        - bottom
      "meta:enum":
        default: "Inherit from grid"
        top: "Top"
        center: "Center"
        bottom: "Bottom"
      examples:
        - default

    extra_classes:
      type: string
      title: "Extra CSS classes"
      description: "Additional CSS classes appended to this cell."
      examples:
        - 'overflow-hidden'

slots:
  content:
    title: "Cell content"
    description: "Drop any component here."
