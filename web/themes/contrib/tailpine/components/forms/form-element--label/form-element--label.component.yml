$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Form Element Label
status: stable
group: Forms & Inputs
description: Form element label component.
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    title:
      type: ['string', 'null']
      description: The label's text.
    title_display:
      type: ['string', 'null']
      description: Element's title_display setting.
    required:
      type: ["array", "string",'boolean', "object" , "null"]
      description: An indicator for whether the associated form element is required.
