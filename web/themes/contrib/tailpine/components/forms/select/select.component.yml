$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Select
status: stable
group: Forms & Inputs
description: 'The select #type form element component.'
props:
  description: 'The properties accepted by the select component.'
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    options:
      type: array
      title: options
      default: []
      description: 'The <option> and <optgroup> element children as rendered by form_select_options(). Each item is an object with type, value, label, selected keys (or optgroup with nested options).'
