$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Spinner (Canvas)
status: stable
description: Loading spinner for indicating processing state.
group: UI
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    size:
      type: string
      title: Size
      description: Spinner size.
      default: md
      enum:
        - sm
        - md
        - lg
        - xl
    color:
      type: string
      title: Color
      description: Spinner color.
      default: primary
      enum:
        - primary
        - secondary
        - body
        - white
    label:
      type: string
      title: Label
      description: Accessible label for spinner.
      default: 'Loading...'
      examples: ['Loading...', 'Please wait...']
