$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Text (Tailpine)
description: Responsive text component
status: stable
props:
  type: object
  properties:

    text_content:
      title: add text
      type: string
      description: "Description of the card. Plain text." 
      contentMediaType: text/html
      x-formatting-context: block
      examples: ['This is formatted description text']

    html_tag:
      type: string
      title: HTML tag 
      enum: [ p, div, span,  small, strong, em, a] 
      description: "Choose which HTML element to render the text as."
      examples: ['p']

    text_size:
      type: string
      title: Size
      enum:
        - default
        - text-8xl(96px)
        - text-7xl(72px)
        - text-6xl(60px)
        - text-5xl(48px)
        - text-4xl(36px)
        - text-3xl(30px)
        - text-2xl(24px)
        - text-xl(20px)
        - text-lg(18px)
        - text-base(16px)
        - text-sm(14px)
        - text-xsm(12px)
      default: text-xl(20px)

    text_color:
      type: string
      title: Text color
      enum:
        - none
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - dark
        - transparent
      meta:enum:
        none: None
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        dark: Dark Color
        transparent: Transparent
      examples: ['none']
    text_width:
      type: string
      title: Text Width
      enum:
        - "10%"
        - "20%"
        - "25%"
        - "30%"
        - "33%"
        - "40%"
        - "50%"
        - "60%"
        - "66%"
        - "70%"
        - "75%"
        - "80%"
        - "90%"
        - "full"
        - "fit"
      meta:enum:
        20%: '20%'
        25%: '25%'
        30%: '30%'
        33%: '33%'
        40%: '40%'
        50%: '50%'
        60%: '60%'
        66%: '66%'
        70%: '70%'
        75%: '75%'
        80%: '80%'
        90%: '90%'
        full: '100% (Full Width)'
        fit: "Fit Content"
      examples: ['fit'] 

    text_decoration:
      type: string
      title: Text Decoration
      default: default
      enum:
        - default
        - underline
        - overline
        - line-through
        - no-underline
      meta:enum:
        default: Default (none)
        underline: Underline
        overline: Overline
        line-through: Strikethrough
        no-underline: Remove decoration
      examples:
        - default

    text_bg_color:
      type: string
      title: Set text Background
      enum:
        - none
        - primary
        - secondary
        - tertiary
        - body
        - body-bg
        - surface-100
        - surface-200
        - surface-300
        - dark
      meta:enum:
        none: None
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        body: Body
        body-bg: Body Background
        surface-100: Light Surface
        surface-200: Medium Surface
        surface-300: Strong Surface
        dark: Dark Color

    horizontal_align:
      type: string
      title: Horizontal Alignment
      enum: ['left', 'center', 'right']
      default: 'left'

    url:
      type: string
      title: "Link URL"
      description: "Required if tag is anchor"
      conditions:
        html_tag: a


    padding_inline:
      type: string
      title: Padding inline (Left / Right)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Padding"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    padding_block:
      type: string
      title: Padding Block (Top / Bottom)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Padding"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    margin_top:
      type: string
      title: Margin ( Top )
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Margin Top"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]

    margin_bottom:
      type: string
      title: Margin (Bottom)
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No Margin Bottom"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [none]


    text_classes:
      type: array
      items:
        type: string
      title: Extra CSS classes
