$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json

name: Post Style Header (Canvas)
description: Header section for post listings with title and CTA.
status: stable
group: Cards & Posts

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    title:
      title: Title
      type: string
      description: Section title text.
      examples:
        - Latest Posts

slots:
  content:
    title: Post Content
    description: Post cards or listing content rendered below the header.

  cta:
    title: Header CTA
    description: Call-to-action button or link displayed in the header.
