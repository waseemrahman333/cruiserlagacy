# ─────────────────────────────────────────────────────────────────────────────
# PROPS
# ─────────────────────────────────────────────────────────────────────────────
props:
  type: object
  properties:

    # ── Preset layouts ──────────────────────────────────────────────────────
    enable_container:
      title: "Enable Container"
      description: "Enable container class"
      type: boolean
      default: true
    
    enable_preset_layout:
      title: "Enable Preset Layout"
      description: "Enable container class"
      type: boolean
      default: false
    
    layout_preset_value:
      title: "Preset Layout"
      description: Pick a predefined grid layout. Overrides manual column/row settings.
      type: string
      enum:
        - custom
        - 1col
        - 2col
        - 3col
        - 4col
        - 5col
        - 6col
        - preset_sidebar_left
        - preset_sidebar_right
        - preset_hero_3col
        - preset_2top_3bottom
        - preset_mosaic_6
        - preset_featured_left
        - preset_featured_right
        - preset_3top_2bottom
        - preset_magazine
      "meta:enum":
        custom: "Custom (use manual controls)"
        1col: "1 Column"
        2col: "2 Columns"
        3col: "3 Columns"
        4col: "4 Columns"
        5col: "5 Columns"
        6col: "6 Columns"
        preset_sidebar_left: "Sidebar Left + Wide Content "
        preset_sidebar_right: "Sidebar Right + Wide Content"
        preset_hero_3col: "3 Equal Tall Columns"
        preset_2top_3bottom: "2 Top + 3 Bottom"
        preset_mosaic_6: "Mosaic  (3 × 2)"
        preset_featured_left: "Featured Left (Large + 2 Small)"
        preset_featured_right: "Featured Right (2 Small + Large)"
        preset_3top_2bottom: "Top 3 + Bottom 2 (With Sidebar)"
        preset_magazine: "Magazine Layout"
      default: custom

    # ── Columns per breakpoint (custom mode) ────────────────────────────────
    grid_cols:
      title: "Columns — Mobile (default)"
      type: integer
      enum: [1, 2, 3, 4]
      "meta:enum":
        1: "1 column"
        2: "2 columns"
        3: "3 columns"
        4: "4 columns"
      default: 1
      examples: [1]

    grid_cols_md:
      title: "Columns — MD (Tablet ≥ 768px )"
      type: integer
      enum: [1, 2, 3, 4, 5, 6]
      "meta:enum":
        1: "1 Column"
        2: "2 Columns"
        3: "3 Columns"
        4: "4 Columns"
      default: 2
      examples: [2]

    grid_cols_lg:
      title: "Columns — LG (Wide Tablet ≥ 1024px)"
      type: integer
      enum: [1, 2, 3, 4, 5, 6]
      "meta:enum":
        1: "1 Column"
        2: "2 Columns"
        3: "3 Columns"
        4: "4 Columns"
        5: "5 Columns"
        6: "6 Columns"
      default: 3
      examples: [3]

    grid_cols_xl:
      title: "Columns — XL (Desktop ≥ 1280px)"
      type: integer
      enum: [1, 2, 3, 4, 5, 6]
      "meta:enum":
        1: "1 Column"
        2: "2 Columns"
        3: "3 Columns"
        4: "4 Columns"
        5: "5 Columns"
        6: "6 Columns"
      default: 4
      examples: [4]

    # ── Rows per breakpoint (0 = auto) ──────────────────────────────────────
    grid_rows:
      title: "Rows — Mobile (auto)"
      description: "Explicitly define row count. 0 means auto — overflow wraps to new row."
      type: integer
      enum: [0, 1, 2, 3]
      "meta:enum":
        0: "Auto (Overflow wraps)"
        1: "1 Row"
        2: "2 Rows"
        3: "3 Rows"
      default: 0
      examples: [1]

    # ── Gap ─────────────────────────────────────────────────────────────────

    gap_x:
      title: "Column Gap"
      description: "Override horizontal gap only. Leave empty to use Gap setting."
      type: string
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
      "meta:enum":
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
      examples: [sm]

    # ── gap ──────────────────────────────────────────────────────────
    gap_y:
      title: "Row Gap"
      description: "Override vertical gap only. Leave empty to use Gap setting."
      type: string
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
      "meta:enum":
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
      examples: [sm]

    # ── Background ──────────────────────────────────────────────────────────
    background_color:
      title: "Background Color"
      type: string
      enum:
        - transparent
        - white
        - light
        - gray
        - dark
        - black
        - primary
        - secondary
        - tertiary
      "meta:enum":
        transparent: "Transparent"
        white: "White"
        light: "Light (Gray 50)"
        gray: "Gray (Gray 100)"
        dark: "Dark"
        black: "Black"
        primary: "Primary"
        secondary: "Secondary"
        tertiary:  "Tertiary"

    background_image:
      $ref: "json-schema-definitions://canvas.module/image"
      type: object
      title: "Background Image"
      description: "Optional full-bleed background image."
      examples:
        - src: https://placehold.co/1900x999
          alt: grid bg
          width: 1900
          height: 999

    background_size:
      title: "Background Size"
      type: string
      enum:
        - bg-cover
        - bg-contain
        - bg-auto
      "meta:enum":
        bg-cover: "Cover"
        bg-contain: "Contain"
        bg-auto: "Auto"
      default: bg-cover

    # ── Section padding ──────────────────────────────────────────────────────
    padding_block:
      title: "Padding Block (Top & Bottom)"
      type: string
      enum:
        - none
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - huge
      "meta:enum":
        none: "No padding"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        huge: "Huge"
      default: lg
      examples: [md]

    min_height:
      title: "Minimum Height"
      type: string
      enum:
        - none
        - min-h-0
        - min-h-screen
        - min-h-[300px]
        - min-h-[400px]
        - min-h-[500px]
        - min-h-[600px]
        - min-h-[700px]
        - min-h-[800px]
      "meta:enum":
        none: None
        min-h-0:  Zero
        min-h-screen:  Full Viewport
        min-h-[300px]: 300px
        min-h-[400px]: 400px
        min-h-[500px]: 500px
        min-h-[600px]: 600px
        min-h-[700px]: 700px
        min-h-[800px]: 800px

    extra_classes:
      title: "Extra CSS Classes"
      description: "Additional Tailwind or custom classes appended to the grid wrapper."
      type: string
      examples:
        - "rounded-xl overflow-hidden"
