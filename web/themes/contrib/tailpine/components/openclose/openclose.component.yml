$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Open Close
description: Single Open Close Component
status: stable
props:
  type: object
  required:
    - text
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    text:
      type: string
      title: Title
      description: The title for the Open Close Component
      examples:
        - Read More
        - Explore More
    detail:
      type: string
      title: Detail
      description: The Detail for the Open Close Component
      examples:
        - Lorem Ipsum ds w asfweee fasdfasdf cdefid asde f alsdfladsf  dslwefdfcd
