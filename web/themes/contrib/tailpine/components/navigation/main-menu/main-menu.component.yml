$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Main Menu
description: Main Menu Component
status: stable
group: Navigation
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    title:
      type: string
      title: Title
      description: The title of the main menu item
      examples: ['Main Menu']
    url:
      type: string
      title: URL
      description: The URL of the main menu item
      examples: ['https://example.com']
    target:
      type: string
      title: Target
      description: The target attribute for the main menu item
      examples: ['_blank']
    children:
      type: array
      title: Sub-menu items
      items:
        type: object
        properties:
          title:
            type: string
            title: Sub-menu Title
            description: The title of the sub-menu item
            examples: ['Sub Menu Item']
          url:
            type: string
            title: Sub-menu URL
            description: The URL of the sub-menu item
            examples: ['https://example.com/submenu']
          target:
            type: string
            title: Sub-menu Target
            description: The target attribute for the sub-menu item
            examples: ['_blank']
          children: # Add this to support nested sub-menus
            type: array
            title: Sub-menu Items
            items:
              item: 'sub-item'
    submenuId:
      type: string
      title: Submenu ID
      description: Computed unique submenu ID.
    childSubmenuId:
      type: string
      title: Child Submenu ID
      description: Computed unique child submenu ID.
    menus:
      type: object
      title: Menus
      description: Imported macro object for recursive rendering.
