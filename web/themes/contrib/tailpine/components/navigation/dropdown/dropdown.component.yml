$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Dropdown
status: stable
description: Dropdown menu with Alpine.js toggle functionality.
group: Navigation
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    button_text:
      type: string
      title: Button Text
      description: Dropdown toggle button text.
    button_color:
      type: string
      title: Button Color
      description: Button color scheme.
      default: primary
slots:
  items:
    title: Menu Items
    description: Dropdown menu items content.
