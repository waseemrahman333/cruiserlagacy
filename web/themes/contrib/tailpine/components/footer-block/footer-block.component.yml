$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Footer Block (Tailpine)
status: stable
description: "A flexible content block with optional heading, optional underline, and a slot for any block content."
group: Footer

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.

    show_title:
      type: boolean
      title: "Show Heading"
      description: "Show title of the list"
      default: true
      examples: [true]

    show_underline:
      type: boolean
      title: "Show Underline"
      description: "Show a decorative underline below the heading"
      default: true
      examples: [true]

    show_content:
      type: boolean
      title: Show Content Region
      default: true
      examples:
        - true


    heading:
      type: string
      title: "Heading Text"
      description: "Leave empty to hide the heading entirely."
      examples: ["Quick Links"]

    heading_size:
      type: string
      title: "Heading Size"
      default: lg
      enum: [xs, sm, base, lg, xl, 2xl, 3xl, 4xl, 5xl, 6xl, 7xl]
      meta:enum:
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"
        3xl: "3X Large"
        4xl: "4X Large"
        5xl: "5X Large"
        6xl: "6X Large"
        7xl: "7X Large"

    heading_weight:
      type: string
      title: "Heading Weight"
      default: bold
      enum: [thin, extralight, light, normal, medium, semibold, bold, extrabold, black]
      meta:enum:
        thin: "Thin — 100"
        extralight: "Extra Light — 200"
        light: "Light — 300"
        normal: "Normal — 400"
        medium: "Medium — 500"
        semibold: "Semibold — 600"
        bold: "Bold — 700"
        extrabold: "Extra Bold — 800"
        black: "Black — 900"

    heading_alignment:
      type: string
      title: "Heading Alignment"
      enum: [left, center, right]
      default: left
      examples: ["left"]

# djf fldsa ndvsa

    underline_width:
      type: string
      title: "Underline Width"
      default: full
      enum: [full, "10", "20", "25", "33", "40", "50", "60", "66", "75", "80", "90"]
      meta:enum:
        full: "Full — 100%"
        "10": "10%"
        "20": "20%"
        "25": "25% — Quarter"
        "33": "33% — One Third"
        "40": "40%"
        "50": "50% — Half"
        "60": "60%"
        "66": "66% — Two Thirds"
        "75": "75% — Three Quarters"
        "80": "80%"
        "90": "90%"

    underline_thickness:
      type: string
      title: "Underline Thickness"
      default: px
      enum: [half, px, "2", "4", "8"]
      meta:enum:
        half: "Ultra Thin"
        px: "Hairline"
        "2": "Thin"
        "4": "Medium"
        "8": "Thick"

    # underline_color:
    #   type: string
    #   title: "Underline Color"
    #   description: "Tailwind border color class e.g. border-white, border-gray-300, border-primary"
    #   default: "border-current"
    #   examples: ["border-white", "border-gray-300", "border-primary"]

    underline_spacing:
      type: string
      title: "Underline Spacing"
      default: sm
      enum: [none, xs, sm, md, lg, xl]
      meta:enum:
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        
    content_alignment:
      type: string
      title: "Content Alignment"
      default: left
      enum: [left, center, right]
      meta:enum:
        left: "Left"
        center: "Center"
        right: "Right"

    content_spacing:
      type: string
      title: "Content Spacing"
      default: md
      enum: [none, xs, sm, md, lg, xl, 2xl]
      meta:enum:
        none: "None"
        xs: "Extra Small"
        sm: "Small"
        md: "Medium"
        lg: "Large"
        xl: "Extra Large"
        2xl: "2X Large"

    content_width:
      type: string
      title: "Content Width"
      default: full
      enum: [ "fit", "10", "20", "25", "33", "40", "50", "60", "66", "75", "80", "90", "full"]
      meta:enum:
        "fit": "Fit — width"
        "10": "10%"
        "20": "20%"
        "25": "25% — Quarter"
        "33": "33% — One Third"
        "40": "40%"
        "50": "50% — Half"
        "60": "60%"
        "66": "66% — Two Thirds"
        "75": "75% — Three Quarters"
        "80": "80%"
        "90": "90%"
        "full": "Full — 100%"
      examples: ["full"]

slots:
  content:
    title: "Content"
    description: "Any Drupal block — menu, text, views, etc."
