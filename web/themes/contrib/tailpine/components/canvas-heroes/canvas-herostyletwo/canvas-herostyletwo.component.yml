$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
name: Hero Style Two (Canvas)
status: stable
description: "Hero   are used to group and display content in a way that is easily readable."
group: Heros
category: Hero
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    image_url:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Background Image
      description: >
        Background Image of the Hero
      examples:
        - src: 'bg.jpg'
          alt: 'Background Image'
          width: 1900
          height: 999
    title:
      title: Title
      type: string
      description: Title
      examples: ['Welcome to our Website']   
    text_color: &color_field
      type: string
      title: Title color
      enum:
        - primary
        - secondary
        - tertiary
        - white
        - light gray
        - dark gray
        - black
        - transparent
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        white: White
        light gray: Light Gray
        dark gray: Dark Gray
        black: Black
        transparent: Transparent
      examples:
        - white
    description_text_color:
      <<: *color_field
      title: Description Color
    description:
      title: Description
      type: string
      description: Description
      contentMediaType: text/html
      x-formatting-context: block
      examples: ['<p>This is <strong>formatted</strong> description</p>']
slots:
  cta:
    title: Cta
    description: "Link of the Hero. Links."
