$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
status: stable
title: 'User Id'
name: User Id
description: 'A simple user id field to display user id.'
defaults:
  attributes: {}
  items: []
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    items:
      type: array
      title: Items
      item:
        type: string
      default: []
      description: List of all field items.
    is_inline:
      type: boolean
      title: Inline Display
      description: Whether to display the user ID inline (span) instead of delegating to field.html.twig.
      default: false
    field_name:
      type: string
      title: Field Name
      description: Machine name of the field.
    field_type:
      type: string
      title: Field Type
      description: Type of the field.
    label_display:
      type: string
      title: Label Display
      description: How the label is displayed (above, inline, hidden, visually_hidden).
