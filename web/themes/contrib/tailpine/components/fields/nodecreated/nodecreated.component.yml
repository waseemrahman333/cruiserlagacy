$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
status: stable
title: 'Node Title'
name: Node Title
description: 'A simple node title field to display node created date.'
defaults:
  attributes: {}
  items: []
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    items:
      type: array
      title: Items
      item:
        type: string
      default: []
      description: List of all field items.
    classes:
      type: array
      title: CSS Classes
      description: Additional CSS class names for the wrapper element.
      items:
        type: string
    nodecreated_utility_classes:
      type: array
      title: Node Created Utility Classes
      description: Additional Tailwind utility classes for the date wrapper.
      items:
        type: string
