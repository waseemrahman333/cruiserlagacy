$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
status: stable
title: 'Time'
name: Time
description: 'A simple time component to display time text.'
defaults:
  attributes: {}
  text: 'time'
  timestamp: '94994954'
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    text:
      type: [string, 'null']
      description: List of all time text.
    datetime:
      type: ['string', 'null']
      title: Datetime
      description: Machine-readable datetime value for the HTML time element's datetime attribute.
    time_utility_classes:
      type: array
      title: Time Utility Classes
      description: Additional Tailwind utility classes for the time element.
      items:
        type: string
