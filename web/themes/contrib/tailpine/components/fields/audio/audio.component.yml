$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
status: stable
name: Audio
description: A component for displaying video files using the <audio> tag.
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    files:
      type: array
      title: Files
      items:
        type: string
      default: []
      description: Array of file objects with source attributes.
    controls:
      type: boolean
      title: Controls
      description: Display audio controls.
      default: true
    autoplay:
      type: boolean
      title: Autoplay
      description: Autoplay the audio on load.
      default: false
    loop:
      type: boolean
      title: Loop
      description: Loop the audio playback.
      default: false
    audio_utility_classes:
      type: array
      title: Audio Utility Classes
      description: Additional Tailwind utility classes for the audio element.
      items:
        type: string
