$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json
status: stable
name: Comment
description: A component for rendering a comment field, including comments and a comment form.
props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
      description: Additional HTML attributes.
    label_hidden:
      type: boolean
      description: Whether the field label is hidden.
    title_attributes:
      type: Drupal\Core\Template\Attribute
      title: Title HTML attributes
      description: HTML attributes for the comment heading element.
    label:
      type: string
      description: The label for the field.
    title_prefix:
      type: string
      description: Additional output to display before the title.
    title_suffix:
      type: string
      description: Additional output to display after the title.
    comments:
      type: string
      description: List of comments rendered through comment.html.twig.
    comment_form:
      type: string
      description: The 'Add new comment' form.
    field_name:
      type: string
      description: The name of the field.
    field_type:
      type: string
      description: The type of the field.
    label_display:
      type: string
      description: The display settings for the label.
    comment_utility_classes:
      type: array
      title: Comment Utility Classes
      description: Additional Tailwind utility classes for the comment wrapper.
      items:
        type: string
