$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json

name: Sub Hero (Cruiserclassic)
status: stable
description: "Inner-page hero with background image, color or both (image over color), overlay, breadcrumb slot and title."
group: Heros

slots:
  breadcrumb:
    title: Breadcrumb
    description: "Place the breadcrumb block here"

props:
  type: object
  properties:
    background_type:
      type: string
      title: Background Type
      description: "Image on Color: the color is the base layer and the image sits on top of it."
      enum: [image, color, both]
      meta:enum:
        image: Image
        color: Color
        both: Image on Color
      default: image
      examples: [image]

    bg_color:
      type: string
      title: Background Color
      description: "Used for Color and Image on Color."
      enum: [primary, secondary, tertiary, dark, body, body-bg]
      meta:enum:
        primary: Primary (green)
        secondary: Secondary (gold)
        tertiary: Tertiary
        dark: Dark
        body: Text color
        body-bg: Page background
      default: primary
      examples: [primary]

    image_opacity:
      type: string
      title: Image Opacity
      description: "Lower it to let the background color show through (Image on Color)."
      enum: ['100', '80', '60', '40', '20']
      meta:enum:
        '100': 100%
        '80': 80%
        '60': 60%
        '40': 40%
        '20': 20%
      default: '100'
      examples: ['100']

    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Background Image
      examples:
        - src: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=1920'
          alt: 'Classic Land Cruiser'
          width: 1920
          height: 1080

    title:
      type: string
      title: Title
      examples: ['Discover Your Perfect Cruiser']

    height:
      type: string
      title: Height
      enum: ['small', 'default', 'large']
      meta:enum:
        small: Small
        default: default
        large: Large
      default: 'default'
      examples: ['default']

    show_overlay:
      type: boolean
      title: Show Overlay
      description: "Dark layer over the background so the text stays readable."
      default: true
      examples: [true]

    overlay:
      type: string
      title: Overlay Darkness
      enum: ['30', '45', '60', '75']
      meta:enum:
        '30': Light
        '45': Medium
        '60': Dark
        '75': Very dark
      default: '45'
      examples: ['45']

    image_position:
      type: string
      title: Image Focus
      enum: ['center', 'left', 'right']
      meta:enum:
        center: Center
        left: Left
        right: Right
      default: 'center'
      examples: ['center']
