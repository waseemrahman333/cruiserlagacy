$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json

name: Vehicle Body (Cruiserclassic)
status: stable
description: "Vehicle page body: description and video on the left; specifications and button on the right (stacked on mobile/tablet)."
group: Vehicle

slots:
  gallery:
    title: Gallery
    description: "Place the Vehicle photo gallery block here (shows when the vehicle has extra photos)"
  cta:
    title: Button
    description: "e.g. I'm interested"
  specifications:
    title: Specifications
    description: "Place the Vehicle Specifications component here"
  bottom_first:
    title: Bottom – Left
    description: "First column of the full-width bottom row (e.g. Feature List)"
  bottom_second:
    title: Bottom – Right
    description: "Second column of the bottom row; a divider line separates the two"
  # media:
  #   title: Video (embed)
  #   description: "Optional: a remote video / embed. Used instead of the Video field when filled."

props:
  type: object
  properties:
    description_heading:
      type: string
      title: Description Heading
      default: 'Description'
      examples: ['Description']

    description:
      type: string
      title: Description
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>The 1982 Toyota Land Cruiser is a true classic, celebrated for its rugged design and legendary capability.</p>'

    video:
      $ref: json-schema-definitions://canvas.module/video
      type: object
      title: Video

    show_print:
      type: boolean
      title: Show Print Button (no longer used)
      description: "Print button was removed; this setting has no effect"
      default: true
      examples: [true]
