$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json

name: Tile Grid (Cruiserclassic)
status: stable
description: "Full-width row of Link Tiles separated by thin lines (e.g. FJ40 · FJ45 · BJ40)."
group: Layout

props:
  type: object
  properties:
    columns:
      type: string
      title: Columns on Desktop
      description: "Mobile shows 2 columns, tablet 3."
      enum: ['2', '3', '4', '5', '6']
      meta:enum:
        '2': '2 columns'
        '3': '3 columns'
        '4': '4 columns'
        '5': '5 columns'
        '6': '6 columns'
      default: '5'
      examples: ['5']

    outer_border:
      type: boolean
      title: Border Around the Grid
      default: false
      examples: [false]

slots:
  tiles:
    title: Tiles
    description: "Add Link Tile components here."
