$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/schema/sdc.schema.json

name: Footer Menu List (Cruiserclassic)
status: stable
description: "Footer menu links in a row (wraps on small screens) or a column, with an optional title."
group: Navigation
noUi: true

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: HTML attributes
    items:
      type: array
      title: Menu Items
      description: "Menu link items (title, url, below…), as passed by menu templates."
      default: []
    title:
      type: string
      title: Menu Title
    direction:
      type: string
      title: Direction
      enum: [row, column]
      default: row
