slots:
  badge:
    title: "badge"
    description: "Small label shown above the heading (e.g. Our philosophy)."
  heading:
    title: "heading"
    descriptoin: "heading of the main sectoin."
  text:
    title: "text"
    descriptoin: "text of the main sectoin."
  cta:
    title: Add  CTA
    description: Add CTA
