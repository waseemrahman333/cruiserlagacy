        md: "Medium (up to 24px)"
        lg: "Large (up to 32px)"
        xl: "Extra Large (up to 40px)"
        2xl: "2X Large (up to 48px)"
        3xl: "3X Large (up to 64px)"
        huge: "Huge (up to 100px)"
      default: none
      examples: [none]

    section_padding_right:
      type: string
      title: "Section Padding Right"
      enum: [none, xs, sm, md, lg, xl, 2xl, 3xl, huge]
      "meta:enum":
        none: "None"
        xs: "Extra Small (up to 8px)"
        sm: "Small (up to 16px)"
        md: "Medium (up to 24px)"
        lg: "Large (up to 32px)"
        xl: "Extra Large (up to 40px)"
        2xl: "2X Large (up to 48px)"
        3xl: "3X Large (up to 64px)"
        huge: "Huge (up to 100px)"
      default: none
      examples: [none]

    content_padding_top:
      type: string
      title: "Content Padding Top"
      enum: [none, xs, sm, md, lg, xl, 2xl, 3xl, huge]
      "meta:enum":
        none: "None"
        xs: "Extra Small (up to 8px)"
        sm: "Small (up to 16px)"
        md: "Medium (up to 24px)"
        lg: "Large (up to 32px)"
        xl: "Extra Large (up to 40px)"
        2xl: "2X Large (up to 48px)"
        3xl: "3X Large (up to 64px)"
        huge: "Huge (up to 100px)"
