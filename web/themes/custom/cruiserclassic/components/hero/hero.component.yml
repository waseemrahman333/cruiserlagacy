$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Hero (Cruiserclassic)
status: stable
description: "Hero Style One is used to group and display content in a way that is easily readable."
group: Heros
category: Hero
props:
  type: object
  properties:
    image_url:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Background Image
      description: >
        Background Image of the Hero
      examples:
        - src: 'bg.jpg'
          alt: 'Background Image'
          width: 1900
          height: 999
    title:
      title: Title
      type: string
      description: Title
      examples: ['Welcome to our Website']
    description:
      title: Description
      type: string
      description: "Optional text below the title."
      contentMediaType: text/html
      x-formatting-context: block
      examples: ['<p>Cruiser Legacy sells classic Toyota Land Cruiser FJ40, FJ45, BJ40, and BJ45 models from 1970 to 1980, along with professionally rebuilt engines and transmissions.</p>']
  
slots:
  cta:
    title: Cta
    description: "Link of the Hero. Links."

